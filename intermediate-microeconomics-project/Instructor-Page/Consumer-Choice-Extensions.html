<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Consumer Choice Extensions</title>

  <link rel="stylesheet" href="../assets/site.css">
  <link rel="stylesheet" href="../assets/concepts.css">

  <script defer src="../assets/navbar-loader.js"></script>
  <script defer src="../assets/cards-binder.js?v=5"></script>
</head>

<body>
  <div id="navbar-container"></div>

  <!-- =================================================== -->

  <main class="container">
    <h1 class="page-title">
      Consumer Choice Extensions
    </h1>

    <p class="subtitle">
      Subtitle
    </p>

    <!-- General introduction -->
    <section class="intro-box">
      <h2>General intro</h2>

      <p>
        Graphs about Uncertainty and Risk, Two Period Model
      </p>
    </section>

    <h2 class="grid-title">Graphs</h2>

    <section class="grid">

      <!-- Graph block 1 -->
      <article
        class="graph-card"
        data-graph-id="Intertemporal-consumption"
      >
        <div class="graph-thumb">
          <img alt="">
        </div>

        <div class="graph-content">
          <h3
            class="graph-title"
            data-fill="card-title"
          ></h3>

          <p
            class="graph-desc"
            data-fill="card-intro"
          ></p>

          <div class="graph-meta graph-prompt">
            <strong data-fill="prompt-label"></strong>
            <span data-fill="card-prompt"></span>
          </div>

          <div class="graph-actions">
            <a
              class="btn btn-primary"
              data-fill="card-link"
            ></a>
          </div>
        </div>
      </article>

      <!-- Graph block 2 -->
      <article
        class="graph-card"
        data-graph-id="Time-IE-SE"
      >
        <div class="graph-thumb">
          <img alt="">
        </div>

        <div class="graph-content">
          <h3
            class="graph-title"
            data-fill="card-title"
          ></h3>

          <p
            class="graph-desc"
            data-fill="card-intro"
          ></p>

          <div class="graph-meta graph-prompt">
            <strong data-fill="prompt-label"></strong>
            <span data-fill="card-prompt"></span>
          </div>

          <div class="graph-actions">
            <a
              class="btn btn-primary"
              data-fill="card-link"
            ></a>
          </div>
        </div>
      </article>

    </section>
  </main>
</body>
</html>
